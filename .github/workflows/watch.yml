name: UT Bot AVAX 1m signals

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m1-state

      - name: Run watcher
        id: watch
        run: |
          mkdir -p state
          python utbot_avaxusdt_1m.py > output.txt 2>&1 || true
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          cat output.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cat output.txt

      - name: Save state
        if: always()
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m1-state

      - name: Push to ntfy
        if: steps.watch.outputs.output != ''
        run: |
          OUTPUT=$(cat output.txt)
          if [ -n "$OUTPUT" ]; then
            curl -s -X POST \
              -H "Title: AVAX UT Bot 1m" \
              -H "Tags: chart_with_upwards_trend" \
              -d "$OUTPUT" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          fi
